<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>121 Scan instances</title>
<link rel="icon" type="image/png" href="static/icon-192.png">
<link rel="apple-touch-icon" href="static/icon-192.png">
<style>
  :root {
    --bg: #F5F4F9;
    --surface: #FFFFFF;
    --ink: #1D1833;
    --muted: #5D5774;
    --line: #E3E0EE;
    --band: #231B4B;
    --band-muted: #CFC9EE;
    --accent: #5A45C2;
    --on-accent: #FFFFFF;
    --btn-bg: #EFEDF8;
    --btn-ink: #3A2E7A;
    --up-bg: #E3F4EF;
    --up-ink: #136B5C;
    --down-bg: #FDEBDD;
    --down-ink: #A23A06;
    --down-line: #F0B38C;
    --wait-bg: #ECEAF2;
    --wait-ink: #5D5774;
    --test-bg: #FDF3D8;
    --test-ink: #7A5600;
    --main-bg: #ECEAF5;
    --main-ink: #3E3866;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--band);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121022;
      --surface: #1C1931;
      --ink: #ECEAF6;
      --muted: #A9A4C2;
      --line: #2E2A4A;
      --band: #0B0918;
      --accent: #A898F2;
      --on-accent: #161226;
      --btn-bg: #2A2548;
      --btn-ink: #DCD6FF;
      --up-bg: #123A33;
      --up-ink: #7FDCC6;
      --down-bg: #43200C;
      --down-ink: #FFB38A;
      --down-line: #8A4A22;
      --wait-bg: #26223F;
      --wait-ink: #A9A4C2;
      --test-bg: #3A2E0A;
      --test-ink: #F2CF6B;
      --main-bg: #2A2645;
      --main-ink: #CFCAEE;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink); min-height: 100vh;
    font-family: var(--sans); font-size: 14px; line-height: 1.45;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* header */
  header { background: var(--band); color: #fff; }
  .head { max-width: 1160px; margin: 0 auto; padding: 28px 24px 30px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
  .head img { width: 64px; height: 64px; border-radius: 50%; flex: none; }
  .head .title { flex: 1 1 240px; display: flex; flex-direction: column; gap: 2px; }
  .head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .head p { margin: 0; color: var(--band-muted); }
  .head .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .head .checked { font-size: 13px; color: var(--band-muted); }
  .recheck {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px;
    border: 0; border-radius: 10px; background: #fff; color: #231B4B;
    font: 600 14px var(--sans); cursor: pointer;
  }
  .recheck svg { width: 16px; height: 16px; }
  .recheck:disabled { opacity: .6; cursor: progress; }
  .recheck:disabled svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* main */
  main { max-width: 1160px; margin: 0 auto; padding: 28px 24px 56px; display: flex; flex-direction: column; gap: 32px; }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
  .stat .k { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-size: 30px; font-weight: 700; }
  .stat .v small { font-size: 16px; font-weight: 500; color: var(--muted); }
  .stat .v.up { color: var(--up-ink); }
  .stat .v.down { color: var(--down-ink); }
  .stat .v.none { color: var(--muted); }
  .stat .txt { font-size: 14px; }
  code { font-family: var(--mono); font-size: 13px; }

  section.group { display: flex; flex-direction: column; gap: 14px; }
  .group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .group-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .group-head span { font-size: 13px; color: var(--muted); }

  .cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  @media (max-width: 400px) { .cards { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .card.down { border-color: var(--down-line); }

  .card-top { display: flex; align-items: flex-start; gap: 12px; }
  .flag { width: 30px; height: 21px; flex: none; margin-top: 3px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .who h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .who span { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.up { background: var(--up-bg); color: var(--up-ink); }
  .pill.down { background: var(--down-bg); color: var(--down-ink); }
  .pill.checking, .pill.unknown { background: var(--wait-bg); color: var(--wait-ink); }
  .pill.checking::before { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) {
    .pill.checking::before, .recheck:disabled svg { animation: none; }
  }

  .note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--down-bg); color: var(--down-ink); font-size: 13px; }
  .host { font-family: var(--mono); font-size: 13px; color: var(--accent); overflow-wrap: anywhere; }
  .host.unset { color: var(--muted); }

  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 9px; background: var(--btn-bg); color: var(--btn-ink); font-size: 13px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn svg { width: 14px; height: 14px; }
  .btn.unset { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
  .btn.unset:hover { text-decoration: none; }

  .card-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; }
  .branch { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--main-bg); color: var(--main-ink); font-family: var(--mono); font-size: 12px; font-weight: 500; }
  .branch.testing { background: var(--test-bg); color: var(--test-ink); }
  .branch.unset { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
  .branch svg { width: 13px; height: 13px; }
  .rg { font-size: 12px; color: var(--muted); }

  /* branch differences */
  .group-head .diff-link { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--accent); }
  .group-head .diff-link svg { width: 13px; height: 13px; }
  .diff-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 20px; }
  .diff-block { padding: 16px 0; }
  .diff-block + .diff-block { border-top: 1px solid var(--line); }
  .diff-block h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
  .diff-block h3 span { font-weight: 500; color: var(--muted); }
  .commits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .commit { display: flex; align-items: baseline; gap: 12px; }
  .commit::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-2px); }
  .commit .sha { font-family: var(--mono); font-size: 12px; color: var(--accent); flex: none; }
  .commit-body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .commit .msg { overflow-wrap: anywhere; }
  .commit .meta { font-size: 12px; color: var(--muted); }
  .diff-more { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
  .diff-empty { margin: 0; padding: 16px 0; color: var(--muted); }
  .diff-hidden { margin: 0; padding: 12px 0 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  #diff .note { margin: 0; }

  footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
  footer a { color: var(--accent); }
  footer .repo { display: inline-flex; align-items: center; gap: 6px; }
  footer .repo svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<header>
  <div class="head">
    <img src="static/icon-192.png" alt="121 logo">
    <div class="title">
      <h1>121 Scan</h1>
      <p>Instance status across all deployments</p>
    </div>
    <div class="actions">
      <span class="checked" id="checked" aria-live="polite">Checking…</span>
      <button class="recheck" id="refresh" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
        Check again
      </button>
    </div>
  </div>
</header>

<main>
  <section class="summary" aria-label="Summary">
    <div class="stat"><span class="k">Up</span><span class="v up" id="stat-up">–</span></div>
    <div class="stat"><span class="k">Down</span><span class="v down" id="stat-down">–</span></div>
    <div class="stat"><span class="k">How it’s checked</span><span class="txt" id="stat-how"></span></div>
  </section>

  <div id="groups"></div>

  <section class="group" id="diff" aria-live="polite"></section>

  <footer>
    <span>If you need support contact <a href="mailto:jharrison@redcross.nl">jharrison@redcross.nl</a></span>
    <a class="repo" id="repo" target="_blank" rel="noopener noreferrer">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/></svg>
      <span id="repo-name"></span>
    </a>
  </footer>
</main>

<script>
/* ---------------------------------------------------------------------------
 * Instance list — edit this.
 *
 * name           Shown on the card.
 * flag           Key into FLAGS below.
 * appName        Azure Web App name (the deploy workflow's app-name).
 * url            Public URL of the 121 Scan instance.
 * url121         The 121 instance it connects to (its URL_121 setting).
 * subscriptionId Azure subscription ID  } both needed for the Azure link
 * resourceGroup  Azure resource group   }
 * branch         The branch this instance is built from. "main" goes under
 *                Production, anything else under Testing.
 *
 * Empty strings show as "not set"; nothing is guessed.
 * ------------------------------------------------------------------------- */
const REPO_URL = "https://github.com/rodekruis/scandroid";

const INSTANCES = [
  { name: "Demo",       flag: "demo",       appName: "scandroid-demo",       url: "https://scan.demo.121.global/", url121: "https://portal.demo.121.global/", subscriptionId: "e5a80ab6-326f-4d9e-8191-35c9cc898cdc", resourceGroup: "scandroid-app_group", branch: "testing" },
  { name: "Cameroon",   flag: "cameroon",   appName: "scandroid-cameroon",   url: "https://scan.cameroon.121.global/", url121: "https://portal.cameroon.121.global/", subscriptionId: "e5a80ab6-326f-4d9e-8191-35c9cc898cdc", resourceGroup: "scandroid-app_group", branch: "main" },
  { name: "Chad",       flag: "chad",       appName: "scandroid-app",        url: "https://scan.chad.121.global/", url121: "https://portal.chad.121.global/", subscriptionId: "e5a80ab6-326f-4d9e-8191-35c9cc898cdc", resourceGroup: "scandroid-app_group", branch: "main" },
  { name: "Mauritania", flag: "mauritania", appName: "scandroid-mauritania", url: "https://scan.mauritania.121.global/", url121: "https://portal.mauritania.121.global/", subscriptionId: "e5a80ab6-326f-4d9e-8191-35c9cc898cdc", resourceGroup: "scandroid-app_group", branch: "main" },
  { name: "Nigeria",    flag: "nigeria",    appName: "scandroid-nigeria",    url: "https://scan.nigeria.121.global/", url121: "https://portal.nigeria.121.global/", subscriptionId: "e5a80ab6-326f-4d9e-8191-35c9cc898cdc", resourceGroup: "scandroid-app_group", branch: "main" },
  { name: "Sudan",      flag: "sudan",      appName: "scandroid-sudan",      url: "https://scan.sudan.121.global/", url121: "https://portal.sudan.121.global/", subscriptionId: "e5a80ab6-326f-4d9e-8191-35c9cc898cdc", resourceGroup: "scandroid-app_group", branch: "main" },
];

/* Simplified 16×11 flags, inline so they render on every OS (Windows does
 * not draw flag emoji). */
const FLAGS = {
  demo:       '<rect width="16" height="11" fill="#fff"/><path d="M6.5 1.5h3v2.5H12v3H9.5v2.5h-3V7H4V4h2.5z" fill="#e30613"/>',
  chad:       '<rect width="16" height="11" fill="#c60c30"/><rect width="10.67" height="11" fill="#fecb00"/><rect width="5.33" height="11" fill="#002664"/>',
  nigeria:    '<rect width="16" height="11" fill="#008751"/><rect x="5.33" width="5.34" height="11" fill="#fff"/>',
  cameroon:   '<rect width="16" height="11" fill="#fcd116"/><rect width="10.67" height="11" fill="#ce1126"/><rect width="5.33" height="11" fill="#007a5e"/><path d="M8 3.6l.55 1.7h1.8l-1.45 1.05.55 1.7L8 7l-1.45 1.05.55-1.7-1.45-1.05h1.8z" fill="#fcd116"/>',
  mauritania: '<rect width="16" height="11" fill="#d01c1f"/><rect y="1.6" width="16" height="7.8" fill="#00a95c"/><path d="M5.6 4.6a2.4 2.4 0 0 0 4.8 0a2.6 2.1 0 0 1-4.8 0z" fill="#ffd700"/><circle cx="8" cy="3.6" r=".7" fill="#ffd700"/>',
  sudan:      '<rect width="16" height="11" fill="#000"/><rect width="16" height="7.33" fill="#fff"/><rect width="16" height="3.67" fill="#d21034"/><path d="M0 0l5.5 5.5L0 11z" fill="#007229"/>',
};

/* Branch comparison shown under the instances: commits in `head` that are
 * not yet in `base`, and the other way round. Uses the public GitHub API
 * (no token, 60 requests per hour per visitor; each check uses 1–2). */
const COMPARE = { base: "main", head: "testing" };

/* Routine commits left out of the comparison, because they don't change
 * what the app does: merge commits, and the workflow-file commits Azure's
 * Deployment Center makes for each environment. Add a pattern to hide more.
 * "Compare on GitHub" still shows everything. */
const HIDE_MERGES = true;
const HIDE_MESSAGES = [
  /^Add or update the Azure App Service build and deployment workflow config/i,
];

const TIMEOUT_MS = 8000;

/* ------------------------------------------------------------------------- */

const ICONS = {
  external: '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>',
  branch:   '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7"/><path d="M18 10.5c0 4-6 3-11.2 6"/>',
};

const groupsEl = document.getElementById("groups");
const checkedEl = document.getElementById("checked");
const refreshBtn = document.getElementById("refresh");
const upEl = document.getElementById("stat-up");
const downEl = document.getElementById("stat-down");

document.getElementById("stat-how").innerHTML =
  "Each instance’s <code>/ping</code> must answer within " + TIMEOUT_MS / 1000 + " s.";
document.getElementById("repo").href = REPO_URL;
document.getElementById("repo-name").textContent = REPO_URL.replace(/^https:\/\/github\.com\//, "");

function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    n.append(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
}

function icon(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", "i");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("aria-hidden", "true");
  s.innerHTML = ICONS[name];
  return s;
}

const base = u => u.replace(/\/+$/, "");
const host = u => u.replace(/^https?:\/\//, "").replace(/\/+$/, "");
const ext = { target: "_blank", rel: "noopener noreferrer" };

function azureUrl(i) {
  if (!i.subscriptionId || !i.resourceGroup || !i.appName) return null;
  return "https://portal.azure.com/#resource/subscriptions/" + encodeURIComponent(i.subscriptionId) +
    "/resourceGroups/" + encodeURIComponent(i.resourceGroup) +
    "/providers/Microsoft.Web/sites/" + encodeURIComponent(i.appName) + "/overview";
}

async function fetchWithTimeout(url, opts = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try { return await fetch(url, { ...opts, cache: "no-store", signal: ctrl.signal }); }
  finally { clearTimeout(t); }
}

/* up: the instance answered /ping · down: no answer · unknown: no URL.
 * no-cors can't read the reply, but the request only resolves if the server
 * answered, which is all "up" needs. */
async function check(inst) {
  if (!inst.url) return { state: "unknown" };
  try {
    await fetchWithTimeout(base(inst.url) + "/ping", { mode: "no-cors" });
    return { state: "up" };
  } catch (_) {
    return { state: "down" };
  }
}

const STATUS_TEXT = { checking: "Checking", up: "Up", down: "Down", unknown: "No URL" };

function linkBtn(label, href, primary = false) {
  if (!href) return el("span", { class: "btn unset", title: "Not set in the instance list" }, [label + " not set"]);
  const children = [label];
  if (primary) children.push(icon("external"));
  return el("a", { class: "btn" + (primary ? " primary" : ""), href, ...ext }, children);
}

function card(inst, state) {
  const flag = el("span", {
    class: "flag",
    html: `<svg viewBox="0 0 16 11" width="30" height="21" aria-hidden="true" style="display:block;border-radius:3px">${FLAGS[inst.flag] || ""}</svg>`,
  });

  const top = el("div", { class: "card-top" }, [
    flag,
    el("div", { class: "who" }, [
      el("h3", { text: inst.name }),
      el("span", { text: inst.appName || "app name not set" }),
    ]),
    el("span", { class: "pill " + state, text: STATUS_TEXT[state] }),
  ]);

  const note = state === "down"
    ? el("p", { class: "note", text: "No answer from /ping within " + TIMEOUT_MS / 1000 + " s. Open the Azure App Service to check logs." })
    : null;

  const hostLine = inst.url
    ? el("a", { class: "host", href: base(inst.url), ...ext, text: host(inst.url) })
    : el("span", { class: "host unset", text: "URL not set" });

  const btns = el("div", { class: "btns" }, [
    linkBtn("121 Scan", inst.url ? base(inst.url) : null, true),
    linkBtn("121 Portal", inst.url121 ? base(inst.url121) : null),
    linkBtn("Azure", azureUrl(inst)),
  ]);

  const branch = inst.branch
    ? el("a", {
        class: "branch" + (inst.branch === "main" ? "" : " testing"),
        href: REPO_URL + "/tree/" + encodeURIComponent(inst.branch), ...ext,
      }, [icon("branch"), inst.branch])
    : el("span", { class: "branch unset" }, [icon("branch"), "branch not set"]);

  const foot = el("div", { class: "card-foot" }, [
    branch,
    inst.resourceGroup ? el("span", { class: "rg", text: inst.resourceGroup }) : null,
  ]);

  return el("li", { class: "card " + state }, [top, note, hostLine, btns, foot]);
}

/* Group by branch: main → Production, everything else → Testing. */
const GROUPS = [
  { title: "Production", test: i => i.branch === "main", from: "main" },
  { title: "Testing",    test: i => i.branch !== "main", from: null },
];

const cardSlots = new Map(); // instance index → <li>

function renderAll(states) {
  cardSlots.clear();
  const sections = [];
  for (const g of GROUPS) {
    const members = INSTANCES.map((inst, idx) => ({ inst, idx })).filter(({ inst }) => g.test(inst));
    if (!members.length) continue;
    const branches = [...new Set(members.map(m => m.inst.branch).filter(Boolean))];
    const n = members.length;
    const sub = n + (n === 1 ? " instance" : " instances") +
      (branches.length ? " · built from " + branches.join(", ") : "");
    const list = el("ul", { class: "cards" });
    for (const { inst, idx } of members) {
      const li = card(inst, states[idx]);
      cardSlots.set(idx, li);
      list.append(li);
    }
    sections.push(el("section", { class: "group" }, [
      el("div", { class: "group-head" }, [el("h2", { text: g.title }), el("span", { text: sub })]),
      list,
    ]));
  }
  groupsEl.replaceChildren(...sections);
}

function renderSummary(states, done) {
  const total = INSTANCES.length;
  const up = states.filter(s => s === "up").length;
  const downNames = INSTANCES.filter((_, i) => states[i] === "down").map(i => i.name);

  upEl.replaceChildren(String(done ? up : "–"), " ", el("small", { text: "of " + total }));

  if (!done) {
    downEl.className = "v none";
    downEl.replaceChildren("–");
  } else if (downNames.length) {
    downEl.className = "v down";
    downEl.replaceChildren(String(downNames.length), " ", el("small", { text: downNames.join(", ") }));
  } else {
    downEl.className = "v none";
    downEl.replaceChildren("0 ", el("small", { text: "all answering" }));
  }
}

/* ---- Branch differences ------------------------------------------------ */

const diffEl = document.getElementById("diff");
const REPO_API = "https://api.github.com/repos/" + REPO_URL.replace(/^https:\/\/github\.com\//, "");
const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");

const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
function ago(iso) {
  const s = (new Date(iso) - Date.now()) / 1000;
  const units = [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]];
  for (const [u, n] of units) if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), u);
  return "just now";
}

async function compareBranches(base, head) {
  const r = await fetchWithTimeout(REPO_API + "/compare/" + base + "..." + head,
    { headers: { Accept: "application/vnd.github+json" } });
  if (r.ok) return r.json();
  if ((r.status === 403 || r.status === 429) && r.headers.get("x-ratelimit-remaining") === "0") {
    const reset = Number(r.headers.get("x-ratelimit-reset")) * 1000;
    const at = reset ? new Date(reset).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "later";
    throw new Error("GitHub’s hourly request limit is used up for this network. Check again after " + at + ".");
  }
  if (r.status === 404) throw new Error("GitHub can’t find " + base + " or " + head + " in this repository, or the repository is private.");
  throw new Error("GitHub answered with status " + r.status + ". Check again in a moment.");
}

/* A merge commit has more than one parent; the commits it brings in are
 * listed on their own, so the merge itself adds nothing to read. */
const isRoutine = c =>
  (HIDE_MERGES && Array.isArray(c.parents) && c.parents.length > 1) ||
  HIDE_MESSAGES.some(re => re.test(c.commit.message || ""));

/* One side of the comparison after leaving out routine commits. GitHub
 * returns at most 250 commits; any beyond that are counted as kept. */
function side(commits, total) {
  const kept = commits.filter(c => !isRoutine(c));
  const unseen = Math.max(0, total - commits.length);
  return { kept, unseen, hidden: commits.length - kept.length, count: kept.length + unseen };
}

function commitItem(c) {
  const msg = (c.commit.message || "").split("\n")[0];
  const who = (c.author && c.author.login) || (c.commit.author && c.commit.author.name) || "unknown";
  const when = c.commit.author && c.commit.author.date;
  return el("li", { class: "commit" }, [
    el("a", { class: "sha", href: c.html_url, ...ext, text: c.sha.slice(0, 7) }),
    el("div", { class: "commit-body" }, [
      el("span", { class: "msg", text: msg }),
      el("span", { class: "meta", title: when ? new Date(when).toLocaleString() : null,
        text: who + (when ? ", " + ago(when) : "") }),
    ]),
  ]);
}

function commitBlock(title, s) {
  const shown = s.kept.slice().reverse(); // newest first
  return el("div", { class: "diff-block" }, [
    el("h3", {}, [title + " ", el("span", { text: "(" + s.count + ")" })]),
    el("ul", { class: "commits" }, shown.map(commitItem)),
    s.unseen
      ? el("p", { class: "diff-more", text: "Showing " + s.kept.length + " of " + s.count + ". Open the comparison on GitHub for the rest." })
      : null,
  ]);
}

function renderDiff(s) {
  const { base, head } = COMPARE;
  const headBits = [el("h2", { text: "Branch differences" })];
  let body = null;

  if (s.loading) {
    headBits.push(el("span", { text: "Loading commits from GitHub…" }));
  } else if (s.error) {
    headBits.push(el("span", { text: head + " compared with " + base }));
    body = el("p", { class: "note", text: s.error });
  } else {
    const a = s.result;
    const ahead = side(a.commits, a.ahead_by);
    const behind = side(s.behind, a.behind_by);

    const parts = [];
    if (ahead.count) parts.push(base + " is " + plural(ahead.count, "commit") + " behind " + head);
    if (behind.count) parts.push(head + " is " + plural(behind.count, "commit") + " behind " + base);
    headBits.push(el("span", { text: parts.length ? parts.join("; ") : base + " and " + head + " have the same changes" }));
    headBits.push(el("a", { class: "diff-link", href: a.html_url, ...ext }, ["Compare on GitHub", icon("external")]));

    const blocks = [];
    if (ahead.count) blocks.push(commitBlock("In " + head + ", not yet in " + base, ahead));
    if (behind.count) blocks.push(commitBlock("In " + base + ", not in " + head, behind));
    if (!blocks.length) blocks.push(el("p", { class: "diff-empty", text: "Nothing to merge either way." }));

    const hidden = ahead.hidden + behind.hidden;
    if (hidden) blocks.push(el("p", { class: "diff-hidden",
      text: plural(hidden, "routine commit") + " not listed: merges and Azure deployment config. Compare on GitHub shows everything." }));

    body = el("div", { class: "diff-panel" }, blocks);
  }

  diffEl.replaceChildren(el("div", { class: "group-head" }, headBits), body);
}

async function loadDiff() {
  renderDiff({ loading: true });
  try {
    const result = await compareBranches(COMPARE.base, COMPARE.head);
    const behind = result.behind_by ? (await compareBranches(COMPARE.head, COMPARE.base)).commits : [];
    renderDiff({ result, behind });
  } catch (e) {
    const msg = e.name === "AbortError" ? "GitHub didn’t answer within " + TIMEOUT_MS / 1000 + " s. Check again in a moment."
      : e instanceof TypeError ? "Couldn’t reach GitHub from this network."
      : e.message;
    renderDiff({ error: msg });
  }
}

/* ------------------------------------------------------------------------- */

async function run() {
  refreshBtn.disabled = true;
  checkedEl.textContent = "Checking…";
  const states = INSTANCES.map(() => "checking");
  renderAll(states);
  renderSummary(states, false);
  const diffDone = loadDiff();

  await Promise.all(INSTANCES.map(async (inst, i) => {
    const r = await check(inst);
    states[i] = r.state;
    const old = cardSlots.get(i);
    const fresh = card(inst, r.state);
    old.replaceWith(fresh);
    cardSlots.set(i, fresh);
  }));

  renderSummary(states, true);
  await diffDone;
  checkedEl.textContent = "Checked " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  refreshBtn.disabled = false;
}

refreshBtn.addEventListener("click", run);
run();
</script>
</body>
</html>
